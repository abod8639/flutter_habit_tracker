name: habit_tracker
description: "A new Flutter project."

# publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter_dotenv: ^6.0.0

  catppuccin_flutter: ^1.0.0
  cupertino_icons: ^1.0.8
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_heatmap_calendar: ^1.0.5
  flutter_localization: ^0.3.2
  flutter_localizations:
    sdk: flutter
  # supabase_flutter: ^1.10.14
  # flutter_secure_storage: ^10.0.0-beta.4
  flutter_slidable: ^4.0.0
  get: ^4.7.1
  # uuid: ^4.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  icons_launcher: ^3.0.1
  intl: ^0.20.2
  supabase_auth_ui: ^0.5.5
  supabase_flutter: ^2.9.1
  internet_connection_checker: ^3.0.1
  # liquid_glass_renderer: ^0.1.1-dev.9
  # glass: ^2.0.0+2
dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  # uses-asset-bundle-paths: true
  assets:
    - .env
    - assets/image/

  uses-material-design: true
