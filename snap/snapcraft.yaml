name: habit_tracker
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-habit_tracker: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.habit_tracker # adjust accordingly to your app name

apps:
  habit_tracker:
    command: habit_tracker
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-habit_tracker
parts:
  habit_tracker:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
