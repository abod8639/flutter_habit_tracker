  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
icons_launcher:
  image_path: "assets/image/icon/icon for habit_tracker app.png"
  platforms:
    ios:
      enable: true
    android:
      enable: true
    linux:
      enable: true
      image_path: "assets/image/icon/icon for habit_tracker app.png"
flutter_intl:
  enabled: true
